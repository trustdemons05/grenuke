[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grenuke"
version = "1.0.0"
description = "Rebuilds the UPI fraud-ring submissions from the raw competition data"
readme = "README.md"
# Reference interpreter: CPython 3.13. requirements.txt pins the exact releases.
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "polars>=1.30",
  "scipy>=1.13",
  "lightgbm>=4.5",
  "xgboost>=3.0",
  "catboost>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["grenuke"]
